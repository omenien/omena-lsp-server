[package]
name = "omena-lsp-server"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Rust LSP server boundary and multi-editor runtime for Omena"
repository = "https://github.com/omenien/omena-lsp-server"
readme = "README.md"
keywords = ["omena", "css-modules", "lsp", "language-server"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_lsp_server"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
omena-incremental = "0.1.2"
omena-query = "0.1.13"
omena-tsgo-client = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
