[package]
name = "omena-lsp-server"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Rust LSP server boundary and multi-editor runtime for Omena"
repository = "https://github.com/omenien/omena-lsp-server"
readme = "README.md"
keywords = ["omena", "css-modules", "lsp", "language-server"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_lsp_server"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
omena-bridge = { git = "https://github.com/omenien/omena-bridge.git", rev = "4829a94" }
omena-incremental = { git = "https://github.com/omenien/omena-incremental.git", rev = "89e5631" }
omena-query = { git = "https://github.com/omenien/omena-query.git", rev = "745cebd" }
omena-tsgo-client = { git = "https://github.com/omenien/omena-tsgo-client.git", rev = "21f93e2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
